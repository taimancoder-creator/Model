<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAIMAN 3D Character</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b13;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
#scene{width:100vw;height:100vh}
.panel{
 position:absolute;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 width:95%;
 max-width:500px;
 background:#111827;
 padding:15px;
 border:1px solid #26354d;
 border-radius:18px;
}
h3{text-align:center;margin:5px}
.buttons{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
button{
 border:1px solid #00d9ff;
 background:#142337;
 color:white;
 padding:13px 5px;
 border-radius:10px;
 font-size:14px;
}
button:active{background:#007f99}
#status{
 position:absolute;
 top:20px;
 left:0;
 width:100%;
 text-align:center;
 color:#00eaff;
}
</style>
</head>

<body>

<div id="status">3D MODEL YUKLANMOQDA...</div>
<div id="scene"></div>

<div class="panel">
<h3>TAIMAN CHARACTER CONTROL</h3>
<div class="buttons">
<button onclick="rotate(-1)"> Chap</button>
<button onclick="action('idle')"> Turish</button>
<button onclick="rotate(1)">O‘ng </button>

<button onclick="action('walk')"> Yurish</button>
<button onclick="action('run')"> Yugurish</button>
<button onclick="action('hello')"> Salom</button>

<button onclick="zoom(1)"> Zoom</button>
<button onclick="resetCamera()"> Reset</button>
<button onclick="zoom(-1)"> Zoom</button>
</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b13);

const camera = new THREE.PerspectiveCamera(
45, innerWidth/innerHeight, 0.1, 100
);
camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));

const light = new THREE.DirectionalLight(0xffffff,3);
light.position.set(3,5,4);
scene.add(light);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x111827})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.02;
scene.add(floor);

let model=null;
let mixer=null;
let bones={};
let currentAction='idle';
let clock=new THREE.Clock();
let rotation=0;
let walkTime=0;

const loader=new GLTFLoader();

loader.load(
'Business_Female_01.glb',
gltf=>{
 model=gltf.scene;
 scene.add(model);

 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());

 model.position.x=-center.x;
 model.position.z=-center.z;
 model.position.y=-box.min.y;

 const maxSize=Math.max(size.x,size.y,size.z);
 model.scale.setScalar(2.1/maxSize);

 model.traverse(obj=>{
  if(obj.isBone){
   bones[obj.name.toLowerCase()]=obj;
  }
 });

 document.getElementById('status').innerText='MODEL TAYYOR ';
},
undefined,
error=>{
 document.getElementById('status').innerText='MODEL YUKLANMADI: '+error.message;
 console.error(error);
}
);

function findBone(words){
 for(const name in bones){
  if(words.some(w=>name.includes(w))) return bones[name];
 }
 return null;
}

function animateCharacter(dt){
 walkTime+=dt;

 const leftArm=findBone(['leftarm','leftupperarm']);
 const rightArm=findBone(['rightarm','rightupperarm']);
 const leftLeg=findBone(['leftupleg','leftthigh']);
 const rightLeg=findBone(['rightupleg','rightthigh']);

 if(!model)return;

 const moving=currentAction==='walk'||currentAction==='run';
 const speed=currentAction==='run'?12:6;
 const swing=moving?Math.sin(walkTime*speed)*0.55:0;

 if(leftArm) leftArm.rotation.x=swing;
 if(rightArm) rightArm.rotation.x=-swing;
 if(leftLeg) leftLeg.rotation.x=-swing;
 if(rightLeg) rightLeg.rotation.x=swing;

 if(currentAction==='hello'&&rightArm){
  rightArm.rotation.x=-2.2+Math.sin(walkTime*9)*0.2;
  rightArm.rotation.z=-0.6;
 }
}

window.action=function(type){
 currentAction=type;
 walkTime=0;
};

window.rotate=function(dir){
 rotation+=dir*Math.PI/4;
 if(model)model.rotation.y=rotation;
};

window.zoom=function(dir){
 camera.position.z=Math.max(1.5,Math.min(8,camera.position.z-dir*0.4));
};

window.resetCamera=function(){
 camera.position.set(0,1.5,4);
 rotation=0;
 if(model)model.rotation.y=0;
};

function loop(){
 requestAnimationFrame(loop);
 const dt=clock.getDelta();
 animateCharacter(dt);
 renderer.render(scene,camera);
}
loop();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
